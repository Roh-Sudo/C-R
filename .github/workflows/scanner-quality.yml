name: Scanner Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scanner-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality:benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-quality-report
          path: benchmarks/scanner-quality-report.*